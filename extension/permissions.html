<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipDesk permissions</title>
  </head>
  <body>
    <main class="min-h-screen flex flex-col items-center justify-center gap-4 p-4 text-center">
      <h1 class="text-2xl font-black">Allow camera and microphone</h1>
      <p class="max-w-md text-sm text-slate-400">ClipDesk needs this once for the camera bubble and voice-over. Recordings stay on your computer.</p>
      <button id="allow" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-sm font-extrabold cursor-pointer">Allow camera & mic</button>
      <p id="result" role="status" class="max-w-md text-sm text-slate-300"></p>
    </main>
    <script type="module" src="./src/permissions.ts"></script>
  </body>
</html>
