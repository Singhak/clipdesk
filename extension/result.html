<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReelScreen recording</title>
  </head>
  <body>
    <main class="min-h-screen flex flex-col items-center justify-center gap-4 p-4 text-center">
      <h1 id="title" class="text-2xl font-black">Loading…</h1>
      <p id="meta" class="text-sm text-slate-400 font-mono"></p>
      <div id="notes" role="alert" hidden class="max-w-md p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-200"></div>
      <video id="video" controls autoplay loop playsinline class="preview-video"></video>
      <div id="actions" class="flex gap-2">
        <button id="download" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-extrabold cursor-pointer">Download</button>
        <button id="delete" class="px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-sm text-slate-300 cursor-pointer">Delete</button>
      </div>
      <p id="format-hint" class="text-xs text-slate-500"></p>
    </main>
    <script type="module" src="./src/result.ts"></script>
  </body>
</html>
