<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self'" />
    <title>ClipDesk countdown</title>
  </head>
  <body class="overlay">
    <div id="ready" hidden class="h-screen flex flex-col items-center justify-center gap-3 px-3">
      <div class="w-full rounded-3xl bg-[#0a0d16]/90 border-2 border-indigo-500 p-5 flex flex-col items-center gap-3 text-center">
        <span class="text-[17px] font-extrabold text-white">Place your camera</span>
        <span class="text-[12.5px] leading-snug text-slate-300">Drag the bubble where you want it. Hover it to resize or flip. Nothing is being recorded yet.</span>
        <button id="start" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-[14px] font-bold text-white cursor-pointer">Start recording</button>
      </div>
      <button id="ready-cancel" class="px-4 py-1.5 rounded-full bg-[#0a0d16]/90 border border-white/20 text-[13px] font-semibold text-slate-200 hover:bg-white/10 cursor-pointer">Cancel</button>
    </div>
    <div id="counting" class="h-screen flex flex-col items-center justify-center gap-4">
      <div class="w-52 h-52 rounded-full bg-[#0a0d16]/85 border-2 border-indigo-500 flex items-center justify-center">
        <span id="num" class="text-[110px] font-black leading-none tabular-nums"></span>
      </div>
      <button id="cancel" class="px-4 py-1.5 rounded-full bg-[#0a0d16]/90 border border-white/20 text-[13px] font-semibold text-slate-200 hover:bg-white/10 cursor-pointer">Cancel</button>
    </div>
    <script type="module" src="./src/countdown.ts"></script>
  </body>
</html>
