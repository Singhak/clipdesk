<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self'" />
    <title>ClipDesk countdown</title>
  </head>
  <body class="overlay">
    <div id="ready" hidden class="h-screen flex flex-col items-center justify-center gap-3 px-3">
      <div class="w-full rounded-3xl bg-[#0a0d16]/90 border-2 border-indigo-500 p-5 flex flex-col items-center gap-3 text-center">
        <span id="ready-title" class="text-[17px] font-extrabold text-white">Place your camera</span>
        <span id="ready-hint" class="text-[12.5px] leading-snug text-slate-300">Drag the bubble where you want it. Hover it to resize or flip. Nothing is being recorded yet.</span>
        <div id="picker" hidden class="w-full space-y-2">
          <div id="picker-area" class="relative w-full overflow-hidden rounded-xl bg-black border border-white/10 cursor-move select-none touch-none" style="aspect-ratio: 16 / 9">
            <img id="picker-img" alt="" class="absolute inset-0 w-full h-full pointer-events-none" />
            <div id="picker-box" class="absolute border-2 border-indigo-400 rounded-sm pointer-events-none" style="box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.62)"></div>
          </div>
          <label class="flex items-center gap-3 text-xs text-slate-400">
            <span class="shrink-0">Zoom in:</span>
            <input id="picker-zoom" type="range" min="1" max="3" step="0.05" value="1" class="flex-1 accent-indigo-500 cursor-pointer" aria-label="Zoom of the area frame" />
            <span id="picker-zoom-val" class="font-mono text-slate-300 w-10 text-right"></span>
          </label>
        </div>
        <button id="start" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-[14px] font-bold text-white cursor-pointer">Start recording</button>
      </div>
      <button id="ready-cancel" class="px-4 py-1.5 rounded-full bg-[#0a0d16]/90 border border-white/20 text-[13px] font-semibold text-slate-200 hover:bg-white/10 cursor-pointer">Cancel</button>
    </div>
    <div id="counting" class="h-screen flex flex-col items-center justify-center gap-4">
      <div class="w-52 h-52 rounded-full bg-[#0a0d16]/85 border-2 border-indigo-500 flex items-center justify-center">
        <span id="num" role="status" aria-live="assertive" aria-atomic="true" aria-label="Countdown" class="text-[110px] font-black leading-none tabular-nums"></span>
      </div>
      <button id="cancel" class="px-4 py-1.5 rounded-full bg-[#0a0d16]/90 border border-white/20 text-[13px] font-semibold text-slate-200 hover:bg-white/10 cursor-pointer">Cancel (Esc)</button>
    </div>
    <p id="notice" role="alert" hidden class="fixed bottom-2 inset-x-2 p-2 rounded-lg bg-amber-500/90 text-[12px] font-semibold text-black text-center"></p>
    <script type="module" src="./src/countdown.ts"></script>
  </body>
</html>
