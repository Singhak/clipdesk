<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self'" />
    <title>ClipDesk Camera Bubble</title>
  </head>
  <body class="overlay w-screen h-screen m-0 p-0 overflow-hidden select-none bg-transparent flex items-center justify-center">
    <div id="bubble-card" class="group relative w-full h-full rounded-full p-[3px] bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 shadow-[0_8px_32px_rgba(0,0,0,0.65)] cursor-grab active:cursor-grabbing transition-transform duration-150 touch-none">
      <!-- Camera Container -->
      <div class="relative w-full h-full rounded-full overflow-hidden bg-[#070913]">
        <video id="webcam" autoplay muted playsinline class="w-full h-full object-cover scale-x-[-1] pointer-events-none block"></video>

        <!-- Shown instead of the picture when the camera can't be opened -->
        <div id="cam-error" role="alert" hidden class="no-drag absolute inset-0 z-10 bg-[#070913] flex flex-col items-center justify-center gap-1 px-4 text-center">
          <span id="cam-error-text" class="text-[12px] font-semibold text-white leading-tight">Camera unavailable</span>
          <button id="btn-cam-off" type="button" class="no-drag px-2 py-0.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-[12px] font-bold text-white cursor-pointer">Record without camera</button>
          <button id="btn-cam-settings" type="button" hidden class="no-drag text-[12px] font-semibold text-indigo-300 hover:text-indigo-200 underline cursor-pointer">Open settings</button>
        </div>

        <!-- Live Camera Badge Indicator -->
        <div class="absolute top-2.5 right-2.5 flex items-center gap-1 bg-black/70 backdrop-blur-md px-1.5 py-0.5 rounded-full border border-white/20 shadow pointer-events-none">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-[12px] font-extrabold text-white tracking-widest uppercase pr-0.5">LIVE</span>
        </div>

        <!-- Hover Controls Overlay -->
        <div id="hover-bar" class="absolute inset-0 bg-black/50 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-2">
          <!-- Nine preset spots; opened with the position button -->
          <div id="pos-grid" hidden class="grid grid-cols-3 gap-1 bg-black/80 p-1.5 rounded-xl border border-white/20 shadow-xl">
            <button type="button" data-x="0.18" data-y="0.15" title="Top left" aria-label="Top left" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">↖</button>
            <button type="button" data-x="0.5" data-y="0.15" title="Top center" aria-label="Top center" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">↑</button>
            <button type="button" data-x="0.82" data-y="0.15" title="Top right" aria-label="Top right" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">↗</button>
            <button type="button" data-x="0.18" data-y="0.5" title="Middle left" aria-label="Middle left" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">←</button>
            <button type="button" data-x="0.5" data-y="0.5" title="Center" aria-label="Center" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">●</button>
            <button type="button" data-x="0.82" data-y="0.5" title="Middle right" aria-label="Middle right" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">→</button>
            <button type="button" data-x="0.18" data-y="0.85" title="Bottom left" aria-label="Bottom left" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">↙</button>
            <button type="button" data-x="0.5" data-y="0.85" title="Bottom center" aria-label="Bottom center" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">↓</button>
            <button type="button" data-x="0.82" data-y="0.85" title="Bottom right" aria-label="Bottom right" class="no-drag pos-cell w-6 h-6 rounded bg-white/10 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer">↘</button>
          </div>
          <div id="tool-row" class="flex items-center gap-1.5 bg-black/80 p-1.5 rounded-full border border-white/20 shadow-xl">
            <button id="btn-pos" class="no-drag w-7 h-7 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center text-xs font-bold transition cursor-pointer" title="Move to a preset position" aria-label="Choose camera position">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
            </button>
            <button id="btn-size" class="no-drag w-7 h-7 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center text-xs font-bold transition cursor-pointer" title="Resize bubble (Small / Medium / Large)" aria-label="Resize camera bubble">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            </button>
            <button id="btn-mirror" class="no-drag w-7 h-7 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center text-xs font-bold transition cursor-pointer" title="Flip mirror" aria-label="Flip camera mirror">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
            </button>
            <button id="btn-close" class="no-drag w-7 h-7 rounded-full bg-rose-600/80 hover:bg-rose-600 text-white flex items-center justify-center text-xs font-bold transition cursor-pointer" title="Hide camera" aria-label="Hide camera">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <span class="text-[12px] font-semibold text-white/90 drop-shadow pointer-events-none select-none">Drag to move</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/camera.ts"></script>
  </body>
</html>
