<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self'" />
    <title>ClipDesk recording</title>
  </head>
  <body class="">
    <main class="min-h-screen flex flex-col items-center justify-center gap-3 p-5 text-center">
      <h1 id="title" class="text-2xl font-black">Loading…</h1>
      <p id="meta" class="text-sm text-slate-400 font-mono"></p>
      <div id="notes" role="alert" hidden class="max-w-md p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-200"></div>
      <video id="video" controls autoplay loop playsinline class="preview-video"></video>
      <div id="actions" class="flex flex-wrap justify-center gap-2">
        <button id="folder" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-extrabold cursor-pointer">Show in folder</button>
        <button id="save-as" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-bold cursor-pointer">Save a copy…</button>
        <button id="again" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-bold cursor-pointer">New recording</button>
        <button id="trash" class="px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-sm text-slate-300 cursor-pointer">Delete</button>
      </div>
      <p id="path" class="text-[11px] text-slate-500 break-all max-w-md"></p>
      <p class="text-xs text-slate-500">Upload the MP4 straight to Instagram Reels, YouTube Shorts or TikTok.</p>
    </main>
    <script type="module" src="./src/result.ts"></script>
  </body>
</html>
