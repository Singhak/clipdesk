name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: uiohook-napi ships prebuilt binaries; nothing here needs a native rebuild
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npx vite build -c vite.electron.config.ts
      - run: npx vite build -c vite.extension.config.ts
      - run: npx vite build -c vite.content.config.ts
